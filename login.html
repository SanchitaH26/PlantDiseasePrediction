<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secured AgriBot Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.auth-container {
    background: white;
    width: 420px;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.form-group {
    margin-bottom: 15px;
}
label {
    font-weight: 600;
    color: #11998e;
}
input, select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}
button {
    width: 100%;
    padding: 12px;
    background: #11998e;
    color: white;
    font-weight: 700;
    border-radius: 10px;
    margin-top: 15px;
    cursor: pointer;
}
button:hover {
    background: #0f766e;
}
.hidden {
    display: none;
}
#auth-message {
    margin-top: 12px;
    text-align: center;
    font-weight: 600;
}
.error { color: #dc2626; }
.success { color: #059669; }
</style>
</head>

<body>

<div class="auth-container">
    <h2 class="text-3xl font-bold text-center text-[#11998e] mb-6">AgriBot Login</h2>

    <!-- LOGIN FORM -->
    <form id="login-form">
        <div class="form-group">
            <label>Username</label>
            <input id="login-username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" required>
        </div>

        <div class="form-group">
            <label>Login as</label>
            <select id="login-role">
                <option value="farmer">Farmer</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <button type="submit">Login</button>

        <p class="text-sm text-center mt-3">
            New user?
            <a href="#" id="show-register" class="text-[#38ef7d] font-semibold">Register</a>
        </p>
    </form>

    <!-- REGISTER FORM -->
    <form id="register-form" class="hidden">
        <div class="form-group">
            <label>Username</label>
            <input id="register-username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="register-password" required>
        </div>

        <div class="form-group">
            <label>Register as</label>
            <select id="register-role">
                <option value="farmer">Farmer</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <button type="submit">Register</button>

        <p class="text-sm text-center mt-3">
            Already registered?
            <a href="#" id="show-login" class="text-[#38ef7d] font-semibold">Login</a>
        </p>
    </form>

    <div id="auth-message"></div>
</div>

<script>


// toggle forms
document.getElementById("show-register").onclick = e => {
    e.preventDefault();
    document.getElementById("login-form").classList.add("hidden");
    document.getElementById("register-form").classList.remove("hidden");
};

document.getElementById("show-login").onclick = e => {
    e.preventDefault();
    document.getElementById("register-form").classList.add("hidden");
    document.getElementById("login-form").classList.remove("hidden");
};

function showMessage(msg, type) {
    const el = document.getElementById("auth-message");
    el.textContent = msg;
    el.className = type;
}

// LOGIN
document.getElementById("login-form").addEventListener("submit", async e => {
    e.preventDefault();

    const username = document.getElementById("login-username").value.trim();
    const password = document.getElementById("login-password").value.trim();
    const role = document.getElementById("login-role").value;

    const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ username, password, role })
    });

    const data = await res.json();

    if (!res.ok) {
        showMessage(data.error, "error");
        return;
    }

    // Redirect based on role
    if (data.role === "admin") {
        window.location.href = "/admin.html";
    } else {
        window.location.href = "/index.html";
    }
});

// REGISTER
document.getElementById("register-form").addEventListener("submit", async e => {
    e.preventDefault();

    const username = document.getElementById("register-username").value.trim();
    const password = document.getElementById("register-password").value.trim();
    const role = document.getElementById("register-role").value;

    const res = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password, role })
    });

    const data = await res.json();

    if (!res.ok) {
        showMessage(data.error, "error");
        return;
    }

    showMessage("Registration successful. Please login.", "success");
});

</script>

</body>
</html>
