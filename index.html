<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

.container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

.tabs {
    display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

.tab {
    flex: 1;
    padding: 15px;
    text-align: center;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            color: #666;
            transition: all 0.3s;
        }

.tab.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }
        
.tab:hover {
            background: #f5f5f5;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
.upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
.upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }
        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
        }
        .upload-icon {
            font-size: 50px;
            color: #667eea;
            margin-bottom: 10px;
        }
#imagePreview {
            max-width: 100%;
            max-height: 400px;
            margin: 20px auto;
            display: none;
            border-radius: 10px;
        }
input[type="file"] {
            display: none;
        }
textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            resize: vertical;
            margin-bottom: 15px;
        }
textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .example-text {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }
button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
        }button:hover {
            transform: scale(1.02);
        }
        button:active {
            transform: scale(0.98);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
.results {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
            display: none;
        }
        .results.show {
            display: block;
            animation: slideIn 0.5s;
        }
@keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .result-header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }.healthy {
            color: #27ae60;
        }
        
        .diseased {
            color: #e74c3c;
        }
        
.result-section {
            margin: 20px 0;
        }
        
    .result-section h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
.result-section p {
            color: #555;
            line-height: 1.6;
        }.confidence {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
        }
    .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
.loading.show {
            display: block;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #fee;
            border: 2px solid #e74c3c;
            color: #c0392b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Plant Disease Detector</h1>
        <p class="subtitle">Detect plant diseases using image or symptoms</p>
        <div class="tabs">
            <button class="tab active" onclick="switchTab('image')">Image Upload</button>
            <button class="tab" onclick="switchTab('text')">Describe Symptoms</button>
        </div>
        <div id="imageTab" class="tab-content active">
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon"></div>
                <h3>Click to Upload Image</h3>
                <p>or drag and drop here</p>
                <p style="font-size: 12px; color: #999; margin-top: 10px;">Supports: JPG, PNG (Max 5MB)</p>
            </div>
            <input type="file" id="fileInput" accept="image/*">
            <img id="imagePreview" alt="Preview">
            <button id="analyzeImageBtn" onclick="analyzeImage()" disabled>Analyze Image</button>
        </div>
        <div id="textTab" class="tab-content">
            <div class="example-text">
                <strong>Example:</strong> "My tomato plant has dark spots with yellow rings around them"
            </div>
            <textarea id="symptomsInput" placeholder="Describe what you see on your plant...&#10;&#10;For example:&#10;- What type of plant? (tomato, pepper, potato)&#10;- What do you see? (spots, discoloration, wilting)&#10;- Color of symptoms? (brown, yellow, black)&#10;- Any patterns? (rings, mold, spreading)"></textarea>
            <button onclick="analyzeText()">Diagnose Disease</button>
        </div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing... Please wait</p>
        </div>
        <div class="error" id="error"></div>
        <div class="results" id="results">
            <div class="result-header" id="resultHeader"></div>
            <div class="result-section" id="resultContent"></div>
        </div>
    </div>
    
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (tab === 'image') {
                document.getElementById('imageTab').classList.add('active');
            } else {
                document.getElementById('textTab').classList.add('active');
            }
            hideResults();
        }
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');
        const analyzeBtn = document.getElementById('analyzeImageBtn');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('Please upload an image file (JPG, PNG)');
                return;
            }
            
            if (file.size > 5 * 1024 * 1024) {
                showError('Image size should be less than 5MB');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'block';
                analyzeBtn.disabled = false;
            };
            reader.readAsDataURL(file);
            
            hideResults();
            hideError();
        }
        async function analyzeImage() {
            const file = fileInput.files[0];
            if (!file) {
                showError('Please select an image first');
                return;
            }
            
            showLoading();
            hideResults();
            hideError();
            
            const formData = new FormData();
            formData.append('image', file);
            
            try {
                const response = await fetch('http://localhost:5000/predict-image', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error('Failed to analyze image');
                }
                
                const data = await response.json();
                displayImageResults(data);
            } catch (error) {
                showError('Error analyzing image: ' + error.message);
            } finally {
                hideLoading();
            }
        }
        async function analyzeText() {
            const symptoms = document.getElementById('symptomsInput').value.trim();
            
            if (!symptoms) {
                showError('Please describe the symptoms you observe');
                return;
            }
            
            showLoading();
            hideResults();
            hideError();
            
            try {
                const response = await fetch('http://localhost:5000/predict-text', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ symptoms: symptoms })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to analyze symptoms');
                }
                
                const data = await response.json();
                displayTextResults(data);
            } catch (error) {
                showError('Error analyzing symptoms: ' + error.message);
            } finally {
                hideLoading();
            }
        }
        function displayImageResults(data) {
            const header = document.getElementById('resultHeader');
            const content = document.getElementById('resultContent');
            
            const isHealthy = data.status === 'HEALTHY';
            header.className = 'result-header ' + (isHealthy ? 'healthy' : 'diseased');
            header.innerHTML = `
                ${isHealthy ? 'Healthy' : 'Not Healthy'} ${data.status}
                <br>
                <span class="confidence">Confidence: ${data.confidence.toFixed(1)}%</span>
            `;
            
            content.innerHTML = `
                <div class="result-section">
                    <h3>Detection Result</h3>
                    <p><strong>${data.disease}</strong></p>
                </div>
                
                ${data.predicted_class !== 'healthy' ? `
                <div class="result-section">
                    <h3>Treatment Recommendation</h3>
                    <p>Please describe the symptoms you see for detailed treatment advice, or consult the text diagnosis feature.</p>
                </div>
                ` : `
                <div class="result-section">
                    <h3>Great News!</h3>
                    <p>Your plant appears to be healthy. Continue with good care practices:</p>
                    <ul>
                        <li>Water regularly (1-2 inches per week)</li>
                        <li>Ensure proper sunlight</li>
                        <li>Monitor for any changes</li>
                        <li>Maintain good air circulation</li>
                    </ul>
                </div>
                `}
                
                ${data.top_3_predictions ? `
                <div class="result-section">
                    <h3>Top 3 Predictions</h3>
                    ${data.top_3_predictions.map((pred, idx) => `
                        <p>${idx + 1}. ${pred[0].replace(/_/g, ' ')} - ${pred[1].toFixed(1)}%</p>
                    `).join('')}
                </div>
                ` : ''}
            `;
            
            showResults();
        }
        function displayTextResults(data) {
            const header = document.getElementById('resultHeader');
            const content = document.getElementById('resultContent');
            
            if (!data.diagnosis) {
                header.className = 'result-header';
                header.textContent = 'Could Not Identify Disease';
                content.innerHTML = `
                    <div class="result-section">
                        <h3>No Match Found</h3>
                        <p>Could not identify the disease from your description.</p>
                        <p><strong>Try these tips:</strong></p>
                        <ul>
                            <li>Be more specific about what you see</li>
                            <li>Mention colors (brown, yellow, black spots)</li>
                            <li>Describe patterns (rings, mold, wilting)</li>
                            <li>Specify the plant type (tomato, pepper, potato)</li>
                            <li>Or upload an image for better accuracy</li>
                        </ul>
                    </div>
                `;
            } else {
                const isHealthy = data.diagnosis.disease === 'No Disease Detected';
                header.className = 'result-header ' + (isHealthy ? 'healthy' : 'diseased');
                header.innerHTML = `${isHealthy ? 'Healthy' : 'Not Healthy'} ${data.diagnosis.disease}`;
                
                content.innerHTML = `
                    <div class="result-section">
                        <h3>Identified Disease</h3>
                        <p><strong>${data.diagnosis.disease}</strong></p>
                    </div>
                    
                    <div class="result-section">
                        <h3>Cause</h3>
                        <p>${data.diagnosis.cause}</p>
                    </div>
                    
                    <div class="result-section">
                        <h3>Treatment</h3>
                        <pre style="white-space: pre-wrap; font-family: Arial; line-height: 1.6;">${data.diagnosis.treatment}</pre>
                    </div>
                    
                    <div class="result-section" style="background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107;">
                        <h3>Important Note</h3>
                        <p>For severe infections or if symptoms persist, consult a local agricultural extension office or plant pathologist.</p>
                    </div>
                `;
            }
            
            showResults();
        }
        function showLoading() {
            document.getElementById('loading').classList.add('show');
        }
    function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }function showResults() {
            document.getElementById('results').classList.add('show');
        }
        function hideResults() {
            document.getElementById('results').classList.remove('show');
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }
        
        function hideError() {
            document.getElementById('error').classList.remove('show');
        }
    </script>
</body>
</html>
